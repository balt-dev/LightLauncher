indexmap = { version = "2.14.2", features = ["serde"] }
open = "5.4.5"
slab = "0.4.12"
futures = "0.3.34"
crossbeam-queue = "0.3.14"
bytes = "1.12.1"
ruzstd = "0.9.1"
zip = "9.5.0"
sha256 = { version = "1.6.0", default-features = false }
